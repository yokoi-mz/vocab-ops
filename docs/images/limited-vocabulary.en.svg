<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <rect width="1200" height="584" rx="28" fill="#120e2a"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a69fd0"/>
    </marker>
  </defs>
  <rect x="75.0" y="182.0" width="350" height="206" rx="20" fill="#e8d48a" fill-opacity="0.08" stroke="#e8d48a" stroke-width="2"/>
  <rect x="147" y="200.0" width="14" height="20" rx="3" fill="#120e2a" stroke="#e8d48a" stroke-width="1.6" transform="rotate(-14 154 220.0)"/>
  <rect x="147" y="200.0" width="14" height="20" rx="3" fill="#120e2a" stroke="#e8d48a" stroke-width="1.6" transform="rotate(0 154 220.0)"/>
  <rect x="147" y="200.0" width="14" height="20" rx="3" fill="#120e2a" stroke="#e8d48a" stroke-width="1.6" transform="rotate(14 154 220.0)"/>
  <text x="262" y="222.0" font-size="20" fill="#e8d48a" font-weight="700" text-anchor="middle">Your vocabulary</text>
  <g transform="translate(125.2 262.0) rotate(0)">
    <rect x="-28.4" y="-14" width="56.8" height="28" rx="14" fill="#120e2a"/>
    <rect x="-28.4" y="-14" width="56.8" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">meet</text>
  </g>
  <g transform="translate(200.2 262.0) rotate(0)">
    <rect x="-36.6" y="-14" width="73.2" height="28" rx="14" fill="#120e2a"/>
    <rect x="-36.6" y="-14" width="73.2" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">person</text>
  </g>
  <g transform="translate(279.3 262.0) rotate(0)">
    <rect x="-32.5" y="-14" width="65.0" height="28" rx="14" fill="#120e2a"/>
    <rect x="-32.5" y="-14" width="65.0" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">place</text>
  </g>
  <g transform="translate(362.5 262.0) rotate(0)">
    <rect x="-40.7" y="-14" width="81.4" height="28" rx="14" fill="#120e2a"/>
    <rect x="-40.7" y="-14" width="81.4" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">station</text>
  </g>
  <g transform="translate(162.1 302.0) rotate(0)">
    <rect x="-48.9" y="-14" width="97.8" height="28" rx="14" fill="#120e2a"/>
    <rect x="-48.9" y="-14" width="97.8" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">different</text>
  </g>
  <g transform="translate(249.4 302.0) rotate(0)">
    <rect x="-28.4" y="-14" width="56.8" height="28" rx="14" fill="#120e2a"/>
    <rect x="-28.4" y="-14" width="56.8" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">good</text>
  </g>
  <g transform="translate(308.0 302.0) rotate(0)">
    <rect x="-20.2" y="-14" width="40.4" height="28" rx="14" fill="#120e2a"/>
    <rect x="-20.2" y="-14" width="40.4" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">go</text>
  </g>
  <g transform="translate(362.5 302.0) rotate(0)">
    <rect x="-24.3" y="-14" width="48.6" height="28" rx="14" fill="#120e2a"/>
    <rect x="-24.3" y="-14" width="48.6" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">eat</text>
  </g>
  <g transform="translate(162.1 342.0) rotate(0)">
    <rect x="-36.6" y="-14" width="73.2" height="28" rx="14" fill="#120e2a"/>
    <rect x="-36.6" y="-14" width="73.2" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">friend</text>
  </g>
  <g transform="translate(237.1 342.0) rotate(0)">
    <rect x="-28.4" y="-14" width="56.8" height="28" rx="14" fill="#120e2a"/>
    <rect x="-28.4" y="-14" width="56.8" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">time</text>
  </g>
  <g transform="translate(303.9 342.0) rotate(0)">
    <rect x="-28.4" y="-14" width="56.8" height="28" rx="14" fill="#120e2a"/>
    <rect x="-28.4" y="-14" width="56.8" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">home</text>
  </g>
  <g transform="translate(358.4 342.0) rotate(0)">
    <rect x="-16.1" y="-14" width="32.2" height="28" rx="14" fill="#120e2a"/>
    <rect x="-16.1" y="-14" width="32.2" height="28" rx="14" fill="#a69fd0" fill-opacity="0.1" stroke="#a69fd0" stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="0" y="5" font-size="14" fill="#a69fd0" font-weight="700" text-anchor="middle">…</text>
  </g>
  <text x="250" y="422.0" font-size="16" fill="#a69fd0" font-weight="400" text-anchor="middle">About 130 words. Sentences use only these.</text>
  <text x="828" y="64" font-size="22" fill="#eeeaff" font-weight="700" text-anchor="middle">Few words can still get it across</text>
  <rect x="496" y="92" width="664" height="72" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#93c9e6" stroke-opacity="0.5"/>
  <text x="518" y="120" font-size="14" fill="#93c9e6" font-weight="700" text-anchor="start">What you want to say (“I helped a foreigner at the station”)</text>
  <text x="518" y="150" font-size="20" fill="#eeeaff" font-weight="700" text-anchor="start">駅で外国人を助けた。</text>
  <path d="M 828 166 L 828 196" stroke="#a69fd0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="496" y="206" width="664" height="158" rx="16" fill="#e8d48a" fill-opacity="0.08" stroke="#e8d48a" stroke-width="2"/>
  <text x="518" y="236" font-size="15" fill="#e8d48a" font-weight="700" text-anchor="start">With only the words you know</text>
  <text x="518" y="270" font-size="19" fill="#eeeaff" font-weight="400" text-anchor="start">I met <tspan fill="#e8d48a" font-weight="700">a person from a different place</tspan> at the station</text>
  <text x="518" y="298" font-size="19" fill="#eeeaff" font-weight="400" text-anchor="start">and I <tspan fill="#e8d48a" font-weight="700">was good to him</tspan>.</text>
  <text x="518" y="340" font-size="16" fill="#a69fd0" font-weight="400" text-anchor="start">It gets through: no words for “foreigner” or “help”, so they are rephrased</text>
  <path d="M 828 366 L 828 396" stroke="#a69fd0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="496" y="406" width="664" height="142" rx="16" fill="#8fe39b" fill-opacity="0.08" stroke="#8fe39b" stroke-width="2"/>
  <text x="518" y="436" font-size="15" fill="#8fe39b" font-weight="700" text-anchor="start">Add just a few new words</text>
  <text x="518" y="470" font-size="19" fill="#eeeaff" font-weight="400" text-anchor="start">I <tspan fill="#8fe39b" font-weight="700">helped</tspan> a <tspan fill="#8fe39b" font-weight="700">foreigner</tspan> at the station.</text>
  <text x="518" y="506" font-size="16" fill="#a69fd0" font-weight="400" text-anchor="start">Now it says exactly what you did.</text>
  <text x="518" y="530" font-size="16" fill="#a69fd0" font-weight="400" text-anchor="start">The added words (help, foreigner) become the next words to learn</text>
</svg>
